name: Flight Alerts

on:
  # Rzadki fallback (raz na 3h) na wypadek gdyby cron-job.org zawiódł.
  # GŁÓWNYM triggerem jest cron-job.org wywołujący workflow_dispatch poniżej —
  # jeśli oba triggery działałyby co 20 min naraz, zużywałoby to PODWÓJNIE
  # tyle minut Actions (to był powód wcześniejszego wyczerpania limitu).
  schedule:
    - cron: '0 */3 * * *'    # fallback co 3h
  workflow_dispatch:           # główny trigger z cron-job.org

# Potrzebne do commitowania seen_flights.json z powrotem do repo
permissions:
  contents: write

jobs:
  check-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v5
        with:
          # Używamy domyślnego GITHUB_TOKEN – nie trzeba nic konfigurować
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom flight tracker
        env:
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          # Opcjonalnie zmień SMTP (domyślnie Gmail):
          # SMTP_HOST: smtp.gmail.com
          # SMTP_PORT: 465
        run: python flight_tracker.py

      - name: Zapisz stan (seen_flights.json) do repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_flights.json
          # Jeśli nic się nie zmieniło – zakończ bez push (unikamy konfliktu)
          git diff --cached --quiet && echo "Brak zmian, pomijam push." && exit 0
          git commit -m "chore: update seen flights state [skip ci]"
          # Pull --rebase na wypadek równoległych runów
          git pull --rebase origin main
          git push
