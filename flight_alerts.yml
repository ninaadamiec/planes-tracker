name: Flight Alerts

on:
  # Rare fallback in case cron-job.org fails. The primary trigger is cron-job.org
  # via workflow_dispatch. Do NOT set both to the same frequent interval —
  # that would double Actions minutes usage.
  # At ~83s per run, a 40-minute cron-job.org interval uses ~1440 min/month
  # (safely within the 2 000 min free tier for private repos).
  schedule:
    - cron: '0 6 * * *'   # fallback: once per day at 06:00 UTC
  workflow_dispatch:

# Potrzebne do commitowania seen_flights.json z powrotem do repo
permissions:
  contents: write

jobs:
  check-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v5
        with:
          # Używamy domyślnego GITHUB_TOKEN – nie trzeba nic konfigurować
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom flight tracker
        env:
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          # Opcjonalnie zmień SMTP (domyślnie Gmail):
          # SMTP_HOST: smtp.gmail.com
          # SMTP_PORT: 465
        run: python flight_tracker.py

      - name: Zapisz stan (seen_flights.json) do repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_flights.json
          # Jeśli nic się nie zmieniło – zakończ bez push (unikamy konfliktu)
          git diff --cached --quiet && echo "Brak zmian, pomijam push." && exit 0
          git commit -m "chore: update seen flights state [skip ci]"
          # Pull --rebase na wypadek równoległych runów
          git pull --rebase origin main
          git push
